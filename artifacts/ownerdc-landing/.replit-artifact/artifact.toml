kind = "web"
previewPath = "/"
title = "OwnerDC Landing Page"
version = "1.0.0"
id = "artifacts/ownerdc-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25402

[services.development]
run = "pnpm --filter @workspace/ownerdc-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ownerdc-landing", "run", "build" ]
publicDir = "artifacts/ownerdc-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25402"
BASE_PATH = "/"
